name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create BOSH Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"

      - name: Install bosh-cli
        run: |
          BOSH_VERSION=$(curl -s https://api.github.com/repos/cloudfoundry/bosh-cli/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          curl -Lo /usr/local/bin/bosh \
            "https://github.com/cloudfoundry/bosh-cli/releases/download/v${BOSH_VERSION}/bosh-cli-${BOSH_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/bosh
          bosh --version

      - name: Configure blobstore credentials
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > config/private.yml <<EOF
          ---
          blobstore:
            provider: s3
            options:
              access_key_id: "${AWS_ACCESS_KEY_ID}"
              secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
          EOF

      - name: Download Garage binary blob
        run: |
          # Determine the blob version from packages/garage/spec
          BLOB_FILE=$(grep -E '^\s+-\s+garage/' packages/garage/spec | head -1 \
            | sed 's/.*garage\///' | tr -d ' ')
          # BLOB_FILE is e.g. garage-linux-x86_64-musl-v1.3.1.bin
          # Extract the version string including the leading v
          BLOB_VERSION=$(echo "${BLOB_FILE}" | sed 's/garage-linux-x86_64-musl-//' | sed 's/\.bin//')
          # Strip leading v for CDN path construction
          VERSION="${BLOB_VERSION#v}"
          ARCH="x86_64"
          DOWNLOAD_URL="https://garagehq.deuxfleurs.fr/_releases/v${VERSION}/${ARCH}-unknown-linux-musl/garage"

          echo "Downloading ${DOWNLOAD_URL}"
          curl -fLo "/tmp/${BLOB_FILE}" "${DOWNLOAD_URL}"

          # Verify SHA256 digest
          ACTUAL=$(sha256sum "/tmp/${BLOB_FILE}" | awk '{print $1}')
          echo "SHA256: ${ACTUAL}"

          bosh add-blob "/tmp/${BLOB_FILE}" "garage/${BLOB_FILE}"
          bosh upload-blobs

      - name: Create final release
        run: |
          bosh -n create-release --final --version "${{ steps.version.outputs.version }}"

      - name: Create release tarball
        run: |
          bosh -n create-release \
            "releases/garage/garage-${{ steps.version.outputs.version }}.yml" \
            --tarball "releases/garage/garage-${{ steps.version.outputs.version }}.tgz"
          sha256sum "releases/garage/garage-${{ steps.version.outputs.version }}.tgz" \
            > "releases/garage/garage-${{ steps.version.outputs.version }}.tgz.sha256"

      - name: Commit release index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/garage/ config/blobs.yml
          git commit -m "Release ${{ steps.version.outputs.version }}" || true
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "garage-boshrelease ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            releases/garage/garage-${{ steps.version.outputs.version }}.tgz
            releases/garage/garage-${{ steps.version.outputs.version }}.tgz.sha256
